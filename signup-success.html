<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo - Bruker opprettet</title><style>:root{--n:#071b31;--b:#1479bd;--bg:#f3f6fa;--l:#dce4ec;--m:#65758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#122033}.card{max-width:500px;margin:50px auto;background:#fff;border:1px solid var(--l);border-radius:14px;padding:28px}.brand{font-weight:900;font-size:38px;color:var(--n);text-align:center;margin-bottom:20px}.brand span{font-size:13px;color:var(--b);letter-spacing:1.4px;margin-left:7px}.ok{font-size:42px;text-align:center;margin:10px 0}.muted{color:var(--m);line-height:1.6}.btn{display:block;margin-top:20px;background:var(--n);color:#fff;text-decoration:none;text-align:center;border-radius:9px;padding:12px 14px;font-weight:750}@media(max-width:700px){.card{margin:18px 12px;padding:22px}}</style></head><body><div class="card"><div class="brand">GNS <span>CARGO AS</span></div><div class="ok">✓</div><h2 style="text-align:center">Bruker opprettet</h2><p class="muted">Registreringen er mottatt. Hvis e-postbekreftelse er aktivert, må du først åpne bekreftelseslenken i e-posten din. Deretter må en administrator i GNS Cargo godkjenne brukeren før du får tilgang til systemet.</p><a class="btn" href="/">Til innlogging</a></div></body></html>
