<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo - Venter på godkjenning</title><style>:root{--n:#071b31;--b:#1479bd;--bg:#f3f6fa;--l:#dce4ec;--m:#65758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#122033}.card{max-width:500px;margin:50px auto;background:#fff;border:1px solid var(--l);border-radius:14px;padding:28px}.brand{font-weight:900;font-size:38px;color:var(--n);text-align:center;margin-bottom:20px}.brand span{font-size:13px;color:var(--b);letter-spacing:1.4px;margin-left:7px}.status{width:72px;height:72px;border-radius:50%;margin:8px auto 18px;background:#fff4e8;color:#9a4e00;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}.pending{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff4e8;color:#9a4e00;font-weight:800}.muted{color:var(--m);line-height:1.6}.btn{display:block;margin-top:20px;background:var(--n);color:#fff;text-decoration:none;text-align:center;border-radius:9px;padding:12px 14px;font-weight:750}@media(max-width:700px){.card{margin:18px 12px;padding:22px}}</style></head><body><div class="card"><div class="brand">GNS <span>CARGO AS</span></div><div class="status">✓</div><h2 style="text-align:center">Bruker opprettet</h2><p style="text-align:center"><span class="pending">PENDING – venter på godkjenning</span></p><p class="muted" id="text">Brukeren er nå opprettet i GNS Cargo og ligger klar for godkjenning hos administrator. Du får tilgang når administrator har godkjent brukeren.</p><a class="btn" href="/">Til innlogging</a></div><script>const p=new URLSearchParams(location.search),e=p.get('email');if(e)document.getElementById('text').textContent=e+' er nå opprettet i GNS Cargo og ligger som PENDING. Administrator må godkjenne brukeren før innlogging gir tilgang.';</script></body></html>
