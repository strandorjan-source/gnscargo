<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo - Opprett bruker</title><style>:root{--n:#071b31;--b:#1479bd;--bg:#f3f6fa;--l:#dce4ec;--m:#65758a;--r:#9b2525}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#122033}.card{max-width:440px;margin:50px auto;background:#fff;border:1px solid var(--l);border-radius:14px;padding:26px}.brand{font-weight:900;font-size:38px;color:var(--n);text-align:center;margin-bottom:18px}.brand span{font-size:13px;color:var(--b);letter-spacing:1.4px;margin-left:7px}label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;margin-top:12px}input{width:100%;padding:12px;border:1px solid #d4dee8;border-radius:8px;font-size:16px}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 14px;font-weight:750;cursor:pointer;text-decoration:none;text-align:center}.blue{background:var(--b);color:#fff;flex:1}.white{background:#fff;border:1px solid var(--l);color:#193149}.notice{padding:12px;border-radius:8px;margin:12px 0;background:#fff1f1;color:var(--r);border:1px solid #efcaca}.muted{color:var(--m);font-size:12px;line-height:1.5}.pending{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff4e8;color:#9a4e00;font-weight:800;font-size:11px}@media(max-width:700px){.card{margin:18px 12px;padding:22px}}</style></head><body><div class="card"><div class="brand">GNS <span>CARGO AS</span></div><h2>Opprett bruker</h2><p class="muted">Når registreringen er fullført, opprettes brukeren med status <span class="pending">PENDING</span>. Du får ikke tilgang før administrator godkjenner brukeren.</p><div id="error"></div><form method="post" action="https://lpovhfipxoeqqnfnipia.supabase.co/functions/v1/public-signup" autocomplete="on"><label>Navn<input id="full_name" name="full_name" type="text" autocomplete="name" required></label><label>E-post<input id="email" name="email" type="email" autocomplete="email" required></label><label>Passord<input name="password" type="password" autocomplete="new-password" minlength="6" required></label><label>Gjenta passord<input name="password2" type="password" autocomplete="new-password" minlength="6" required></label><div class="actions"><button class="btn blue" type="submit">Opprett bruker</button><a class="btn white" href="/">Tilbake</a></div></form><p class="muted" style="margin-top:16px">Registreringen går direkte til GNS Cargo sin sikre Supabase-funksjon. Du sendes videre først når brukeren faktisk er opprettet.</p></div><script>const p=new URLSearchParams(location.search),e=p.get('error');if(e)document.getElementById('error').innerHTML='<div class="notice">'+e.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>';document.getElementById('email').value=p.get('email')||'';document.getElementById('full_name').value=p.get('full_name')||'';</script></body></html>
