<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo - Opprett bruker</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#071b31;--b:#1479bd;--bg:#f3f6fa;--l:#dce4ec;--m:#65758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#122033}.card{max-width:440px;margin:50px auto;background:#fff;border:1px solid var(--l);border-radius:14px;padding:26px}.brand{font-weight:900;font-size:38px;color:var(--n);text-align:center;margin-bottom:18px}.brand span{font-size:13px;color:var(--b);letter-spacing:1.4px;margin-left:7px}label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;margin-top:12px}input{width:100%;padding:12px;border:1px solid #d4dee8;border-radius:8px;font-size:16px}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:750;cursor:pointer;text-decoration:none;text-align:center}.blue{background:var(--b);color:#fff}.white{background:#fff;border:1px solid var(--l);color:#193149}.notice{padding:12px;border-radius:8px;margin:12px 0;background:#eef9f3;color:#176740;border:1px solid #c7ead6}.error{background:#fff1f1;color:#9b2525;border-color:#efcaca}.muted{color:var(--m);font-size:12px;line-height:1.5}@media(max-width:700px){.card{margin:18px 12px;padding:22px}}</style></head><body><div class="card"><div class="brand">GNS <span>CARGO AS</span></div><h2>Opprett bruker</h2><p class="muted">Registrer e-post og passord. Etter registrering må en administrator godkjenne tilgangen før systemet kan brukes.</p><div id="msg"></div><label>E-post<input id="email" type="email" autocomplete="email"></label><label>Passord<input id="password" type="password" autocomplete="new-password"></label><label>Gjenta passord<input id="password2" type="password" autocomplete="new-password"></label><div class="actions"><button class="btn blue" id="create">Opprett bruker</button><a class="btn white" href="/">Tilbake</a></div></div><script>const U='https://lpovhfipxoeqqnfnipia.supabase.co',K='sb_publishable_7WEioWEeqiSNE1nSFXD8lg_zosjgsC_',s=window.supabase.createClient(U,K),$=x=>document.getElementById(x);function show(t,e=false){$('msg').innerHTML='<div class="notice '+(e?'error':'')+'>'+String(t).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>'}$('create').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,password2=$('password2').value;if(!email)return show('Skriv inn e-postadresse.',true);if(password.length<6)return show('Passordet må være minst 6 tegn.',true);if(password!==password2)return show('Passordene er ikke like.',true);$('create').disabled=true;$('create').textContent='Oppretter...';try{const{data,error}=await s.auth.signUp({email,password,options:{emailRedirectTo:'https://gnscargo.vercel.app'}});if(error)show(error.message,true);else if(data.user){show('Brukeren er opprettet. Bekreft e-posten hvis du får en bekreftelsesmail. Deretter må administrator godkjenne tilgangen.');}else show('Registreringen ble sendt inn.');}catch(e){show('Registrering feilet: '+e.message,true)}finally{$('create').disabled=false;$('create').textContent='Opprett bruker'}};</script></body></html>
