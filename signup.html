<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo - Opprett bruker</title><style>:root{--n:#071b31;--b:#1479bd;--bg:#f3f6fa;--l:#dce4ec;--m:#65758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#122033}.card{max-width:440px;margin:50px auto;background:#fff;border:1px solid var(--l);border-radius:14px;padding:26px}.brand{font-weight:900;font-size:38px;color:var(--n);text-align:center;margin-bottom:18px}.brand span{font-size:13px;color:var(--b);letter-spacing:1.4px;margin-left:7px}label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;margin-top:12px}input{width:100%;padding:12px;border:1px solid #d4dee8;border-radius:8px;font-size:16px}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:750;cursor:pointer;text-decoration:none;text-align:center}.blue{background:var(--b);color:#fff}.white{background:#fff;border:1px solid var(--l);color:#193149}.notice{padding:12px;border-radius:8px;margin:12px 0;background:#eef9f3;color:#176740;border:1px solid #c7ead6}.error{background:#fff1f1;color:#9b2525;border-color:#efcaca}.muted{color:var(--m);font-size:12px;line-height:1.5}@media(max-width:700px){.card{margin:18px 12px;padding:22px}}</style></head><body><div class="card"><div class="brand">GNS <span>CARGO AS</span></div><h2>Opprett bruker</h2><p class="muted">Registrer e-post og passord. Etter registrering må en administrator godkjenne tilgangen før systemet kan brukes.</p><div id="msg"></div><form id="signupForm"><label>E-post<input id="email" type="email" autocomplete="email" required></label><label>Passord<input id="password" type="password" autocomplete="new-password" minlength="6" required></label><label>Gjenta passord<input id="password2" type="password" autocomplete="new-password" minlength="6" required></label><div class="actions"><button class="btn blue" id="create" type="submit">Opprett bruker</button><a class="btn white" href="/">Tilbake</a></div></form></div><script>const U='https://lpovhfipxoeqqnfnipia.supabase.co';const K='sb_publishable_7WEioWEeqiSNE1nSFXD8lg_zosjgsC_';const $=x=>document.getElementById(x);function show(t,e=false){$('msg').innerHTML='<div class="notice '+(e?'error':'')+'>'+String(t).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>'}async function signup(email,password){const c=new AbortController();const timer=setTimeout(()=>c.abort(),15000);try{return await fetch(U+'/auth/v1/signup',{method:'POST',headers:{'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({email,password,options:{emailRedirectTo:'https://gnscargo.vercel.app'}}),signal:c.signal})}finally{clearTimeout(timer)}}$('signupForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value,password2=$('password2').value;if(!email)return show('Skriv inn e-postadresse.',true);if(password.length<6)return show('Passordet må være minst 6 tegn.',true);if(password!==password2)return show('Passordene er ikke like.',true);const b=$('create');b.disabled=true;b.textContent='Oppretter...';show('Registrerer bruker...');try{const r=await signup(email,password);let data={};try{data=await r.json()}catch{}if(!r.ok){show(data.msg||data.message||data.error_description||('Registrering feilet ('+r.status+').'),true);return}location.replace('/signup-success.html?email='+encodeURIComponent(email));}catch(err){show(err.name==='AbortError'?'Registreringen tok for lang tid. Prøv igjen.':'Registrering feilet: '+err.message,true)}finally{b.disabled=false;b.textContent='Opprett bruker'}});</script></body></html>
