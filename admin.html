<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo - Brukere</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#071b31;--b:#1479bd;--bg:#f3f6fa;--l:#dce4ec;--m:#65758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#122033}.top{background:var(--n);color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:24px}.brand span{font-size:11px;color:#6fc0ee;letter-spacing:1.2px;margin-left:6px}.wrap{max-width:900px;margin:24px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:20px}.muted{color:var(--m)}.row{display:grid;grid-template-columns:1.3fr .6fr 1.4fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f5}.row:last-child{border-bottom:0}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:700;cursor:pointer}.white{background:#fff;border:1px solid var(--l);color:#193149}.green{background:#eaf8f0;color:#176740;border:1px solid #bfe2cc}.navy{background:var(--n);color:white}.red{background:#fff1f1;color:#9b2525;border:1px solid #efcaca}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef6fc;font-size:11px;font-weight:800}.pending{background:#fff4e8;color:#9a4e00}.admin{background:#eaf8f0;color:#176740}.disabled{background:#fff0f0;color:#a52c2c}.login{max-width:420px;margin:60px auto}.login input{width:100%;padding:11px;border:1px solid var(--l);border-radius:8px;margin:5px 0 12px}.hidden{display:none!important}@media(max-width:700px){.row{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}}</style></head><body><div class="top"><div class="brand">GNS <span>CARGO AS</span></div><a class="btn white" href="/">Til Control Tower</a></div><div class="wrap"><div id="loginBox" class="card login hidden"><h2>Administratorinnlogging</h2><div id="msg" class="muted"></div><input id="email" type="email" placeholder="E-post"><input id="password" type="password" placeholder="Passord"><button class="btn navy" id="login">Logg inn</button></div><div id="adminBox" class="card hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">Brukere og tilgang</h2><div class="muted">Nye brukere må godkjennes før de får tilgang.</div></div><button class="btn white" id="refresh">Oppdater</button></div><div id="users" style="margin-top:14px"></div></div><div id="denied" class="card hidden"><h2>Ingen administratortilgang</h2><p class="muted">Denne siden er kun tilgjengelig for administrator.</p></div></div><script>const U='https://lpovhfipxoeqqnfnipia.supabase.co',K='sb_publishable_7WEioWEeqiSNE1nSFXD8lg_zosjgsC_',s=window.supabase.createClient(U,K),$=x=>document.getElementById(x);let me=null;function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function label(r){return r==='admin'?'Administrator':r==='dispatcher'?'Full tilgang':r==='disabled'?'Deaktivert':'Venter'}async function boot(){let{data}=await s.auth.getSession();if(!data.session){$('loginBox').classList.remove('hidden');return}let{data:p}=await s.from('profiles').select('*').eq('id',data.session.user.id).single();me=p;if(!p||p.role!=='admin'){$('denied').classList.remove('hidden');return}$('adminBox').classList.remove('hidden');load()}async function load(){let{data,error}=await s.from('profiles').select('*').order('created_at',{ascending:true});if(error){$('users').innerHTML='<div class="muted">'+esc(error.message)+'</div>';return}$('users').innerHTML=(data||[]).map(p=>`<div class="row"><div><b>${esc(p.full_name||p.email||'Ukjent')}</b><div class="muted">${esc(p.email||'')}</div></div><div><span class="badge ${esc(p.role)}">${label(p.role)}</span></div><div class="actions">${p.id===me.id?'<span class="muted">Din bruker</span>':`<button class="btn green" onclick="setRole('${p.id}','dispatcher')">Gi full tilgang</button><button class="btn navy" onclick="setRole('${p.id}','admin')">Gjør admin</button><button class="btn red" onclick="setRole('${p.id}','disabled')">Deaktiver</button>`}</div></div>`).join('')||'<div class="muted">Ingen brukere.</div>'}window.setRole=async(id,role)=>{let{error}=await s.from('profiles').update({role,approved_at:['admin','dispatcher'].includes(role)?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);load()};$('refresh').onclick=load;$('login').onclick=async()=>{let{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('msg').textContent=error.message;return}location.reload()};boot();</script><!-- force-fresh-vercel-deploy-2026-09-10 --></body></html>
