name: Cargo checks
on:
  push:
    branches: [main, feature/operations-safety]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked test dependencies
        run: npm ci --prefix tests --ignore-scripts --include=dev
      - name: Required release gate
        run: node scripts/release-check.cjs
      - name: Document backup verifier (synthetic fixtures)
        run: python tests/backup-verifier.py
      - name: Dependency security assessment
        run: npm audit --prefix tests --audit-level=high
