name: Cargo checks
on:
  push:
    branches: [main, feature/operations-safety]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package source for offline verification
        run: git archive --format=zip -o cargo-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-reviewed-source
          path: cargo-source.zip
          retention-days: 3
      - name: Install locked test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Run regression checks
        run: |
          node tests/customer-pricing.cjs
          node tests/invoice-diesel-report.cjs
          node tests/admin-users.cjs
          node tests/capacity-booking.cjs
          node tests/verify.cjs
      - name: Run operations checks when present
        run: |
          if [ -f tests/operations.cjs ]; then node tests/operations.cjs; fi
