name: Cargo checks
on:
  push:
    branches: [main, feature/operations-safety]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare reviewed PDF library update
        run: npm install --prefix tests --save-exact --ignore-scripts --save-dev jspdf@4.2.1
      - name: Package isolated test dependencies
        run: tar -czf cargo-test-deps.tgz tests/node_modules tests/package.json tests/package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-test-deps
          path: cargo-test-deps.tgz
          retention-days: 1
      - name: Dependency assessment
        run: npm audit --prefix tests --json
      - name: Run regression checks
        run: |
          node tests/customer-pricing.cjs
          node tests/invoice-diesel-report.cjs
          node tests/admin-users.cjs
          node tests/verify.cjs
