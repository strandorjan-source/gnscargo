<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo Control Tower</title></head><body><script>(async()=>{const r=await fetch('/app.html?v=20260910-creator',{cache:'no-store'});let h=await r.text();const add=`<script>(async()=>{try{const signup=document.getElementById('signup');if(signup){const n=signup.cloneNode(true);n.type='button';n.onclick=()=>location.href='/signup.html';signup.replaceWith(n)}const creatorText=o=>o&&((o.created_by_name||o.created_by_email))?('Opprettet av: '+(o.created_by_name||o.created_by_email)):'Opprettet av: Ukjent';let currentRole='';const toLocal=v=>{if(!v)return '';const d=new Date(v),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};window.editOrder=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;const fields=[['customer','Kunde'],['customer_reference','Kundereferanse'],['goods','Gods'],['pallets','Paller'],['weight_kg','Netto vekt kg'],['temperature','Temperatur'],['pickup_name','Hentested'],['pickup_address','Henteadresse'],['pickup_at','Hentetid'],['pickup_contact','Kontakt hentested'],['pickup_phone','Telefon hentested'],['delivery_name','Leveringssted'],['delivery_address','Leveringsadresse'],['delivery_at','Leveringstid'],['delivery_contact','Kontakt levering'],['delivery_phone','Telefon levering'],['carrier_name','Transportør'],['carrier_email','Transportør e-post'],['driver_name','Sjåfør'],['driver_phone','Sjåfør telefon'],['vehicle_registration','Reg.nr'],['carrier_price','Innkjøpspris'],['customer_price','Salgspris'],['instructions','Instruksjoner']];let vals={};for(const [k,label] of fields){let old=(k==='pickup_at'||k==='delivery_at')?toLocal(o[k]):(o[k]??'');let v=prompt(label,old);if(v===null)return;vals[k]=v}['pallets','weight_kg','carrier_price','customer_price'].forEach(k=>vals[k]=vals[k]===''?null:Number(vals[k]));['pickup_at','delivery_at'].forEach(k=>vals[k]=vals[k]?new Date(vals[k]).toISOString():null);vals.updated_at=new Date().toISOString();const {error}=await s.from('orders').update(vals).eq('id',id);if(error)return alert('Kunne ikke lagre endringer: '+error.message);await load();alert('Ordre #'+o.order_number+' er oppdatert.')};window.deleteOrder=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;if(currentRole!=='admin')return alert('Kun administrator kan slette ordre.');if(!confirm('Slette ordre #'+o.order_number+' permanent? Dette kan ikke angres.'))return;const check=prompt('Skriv SLETT for å bekrefte:','');if(check!=='SLETT')return;const {error}=await s.from('orders').delete().eq('id',id);if(error)return alert('Kunne ikke slette ordre: '+error.message);closeM();await load()};if(typeof rowHtml==='function'){const originalRow=rowHtml;rowHtml=function(o){let html=originalRow(o);const marker='<span class="muted">GNS-'+o.order_number+'</span>';html=html.replace(marker,marker+'<br><span class="muted" style="font-size:10px">'+esc(creatorText(o))+'</span>');html=html.replace('<button class="btn mini white" onclick="openO(\''+o.id+'\')">Åpne</button>','<button class="btn mini white" onclick="openO(\''+o.id+'\')">Åpne</button> <button class="btn mini white" onclick="editOrder(\''+o.id+'\')">Endre</button>');return html}}if(typeof cardHtml==='function'){const originalCard=cardHtml;cardHtml=function(o){let html=originalCard(o);const marker='<div class="muted">GNS-'+o.order_number+'</div>';html=html.replace(marker,marker+'<div class="muted" style="font-size:11px;margin-top:3px">'+esc(creatorText(o))+'</div>');html=html.replace('<button class="btn blue" onclick="openO(\''+o.id+'\')">Åpne ordre</button>','<button class="btn blue" onclick="openO(\''+o.id+'\')">Åpne ordre</button><button class="btn white" onclick="editOrder(\''+o.id+'\')">Endre ordre</button>');return html}}if(typeof openO==='function'){const originalOpen=openO;window.openO=function(id){originalOpen(id);const o=orders.find(x=>x.id===id),sheet=document.getElementById('sheet');if(o&&sheet){const el=document.createElement('div');el.className='muted';el.style.cssText='margin-top:12px;padding-top:10px;border-top:1px solid #e5e7eb;font-size:12px';el.textContent=creatorText(o);sheet.appendChild(el);const actions=document.querySelector('#modal .actions');if(actions){const edit=document.createElement('button');edit.className='btn white';edit.textContent='Endre ordre';edit.onclick=()=>editOrder(o.id);actions.appendChild(edit);if(currentRole==='admin'){const del=document.createElement('button');del.className='btn red';del.textContent='Slett ordre';del.onclick=()=>deleteOrder(o.id);actions.appendChild(del)}}}}}const logout=document.getElementById('logout');const {data:{session}}=await s.auth.getSession();if(session){const {data:p}=await s.from('profiles').select('role').eq('id',session.user.id).single();currentRole=p?.role||'';if(logout&&currentRole==='admin'){const b=document.createElement('button');b.id='usersBtn';b.className='btn blue';b.textContent='Brukere';b.type='button';b.onclick=()=>location.href='/admin.html';logout.parentNode.insertBefore(b,logout)}}if(typeof render==='function')render()}catch(e){console.error(e)}})();<\/script>`;h=h.replace('</body>',add+'</body>');document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<div style="font-family:Arial;padding:30px">Kunne ikke laste GNS Cargo: '+e.message+'</div>');</script></body></html>
