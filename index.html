<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo Control Tower</title></head><body><script>(async()=>{const r=await fetch('/app.html?v=20260911-multistop',{cache:'no-store'});let h=await r.text();const add=`<style>.multiBox{grid-column:1/-1;border:1px solid #dce4ec;background:#f8fbfd;border-radius:12px;padding:14px}.multiHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.multiStops{display:grid;gap:10px;margin-top:10px}.multiStop{background:#fff;border:1px solid #dce4ec;border-radius:10px;padding:12px}.multiStopHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.multiStopGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.loadStatus{grid-column:1/-1;background:#071b31;color:white;border-radius:10px;padding:11px 14px;font-weight:800}.loadStatus small{font-weight:500;color:#c5d4e2}@media(max-width:800px){.multiStopGrid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.multiStopGrid{grid-template-columns:1fr}}</style><script>(async()=>{try{const signup=document.getElementById('signup');if(signup){const n=signup.cloneNode(true);n.type='button';n.onclick=()=>location.href='/signup.html';signup.replaceWith(n)}const form=document.getElementById('form'),grid=form?.querySelector('.grid');if(!form||!grid)return;let extraStops=[];const sec=[...grid.querySelectorAll('.section')];const deliverySec=sec.find(x=>x.textContent.trim()==='Levering'),transportSec=sec.find(x=>x.textContent.trim().includes('Transportør'));function box(type){const d=document.createElement('div');d.className='multiBox';d.dataset.type=type;d.innerHTML='<div class="multiHead"><div><b>'+(type==='pickup'?'Flere lastesteder':'Flere leveringssteder')+'</b><div class="muted" style="font-size:11px">Valgfritt – bruk dette når bilen har flere stopp.</div></div><button type="button" class="btn white addStop">+ Legg til '+(type==='pickup'?'hentested':'leveringssted')+'</button></div><div class="multiStops"></div>';d.querySelector('.addStop').onclick=()=>addStop(type,d.querySelector('.multiStops'));return d}const pickupBox=box('pickup'),deliveryBox=box('delivery');if(deliverySec)grid.insertBefore(pickupBox,deliverySec);if(transportSec)grid.insertBefore(deliveryBox,transportSec);const status=document.createElement('div');status.className='loadStatus';grid.insertBefore(status,transportSec||null);function totals(){const baseP=Number(form.elements.pallets?.value||0),baseW=Number(form.elements.weight_kg?.value||0),ps=extraStops.filter(x=>x.type==='pickup').reduce((a,x)=>a+Number(x.el.querySelector('[data-k=pallets]').value||0),0),ws=extraStops.filter(x=>x.type==='pickup').reduce((a,x)=>a+Number(x.el.querySelector('[data-k=weight_kg]').value||0),0),pc=1+extraStops.filter(x=>x.type==='pickup').length,dc=1+extraStops.filter(x=>x.type==='delivery').length;status.innerHTML='Lastestatus: '+(baseP+ps)+' paller · '+Math.round(baseW+ws).toLocaleString('nb-NO')+' kg · '+pc+' hentested'+(pc>1?'er':'')+' · '+dc+' levering'+(dc>1?'er':'')+'<br><small>Én GNS-referanse gjelder hele bilen.</small>'}function addStop(type,holder){const el=document.createElement('div');el.className='multiStop';const nr=extraStops.filter(x=>x.type===type).length+2;el.innerHTML='<div class="multiStopHead"><b>'+(type==='pickup'?'Henting ':'Levering ')+nr+'</b><button type="button" class="btn red mini remove">Fjern</button></div><div class="multiStopGrid"><label>Sted<input data-k="name" placeholder="Navn på sted"></label><label>Adresse<input data-k="address"></label><label>Tid<input data-k="planned_at" type="datetime-local"></label><label>Kontakt<input data-k="contact_name"></label><label>Telefon<input data-k="phone"></label><label>Gods<input data-k="goods"></label><label>Paller<input data-k="pallets" type="number"></label><label>Netto kg<input data-k="weight_kg" type="number" step="0.1"></label><label>Temperatur<input data-k="temperature"></label><label style="grid-column:span 2">Instruksjon<input data-k="instructions"></label></div>';holder.appendChild(el);const item={type,el};extraStops.push(item);el.querySelector('.remove').onclick=()=>{extraStops=extraStops.filter(x=>x!==item);el.remove();totals()};el.querySelectorAll('input').forEach(i=>i.addEventListener('input',totals));totals()}form.elements.pallets?.addEventListener('input',totals);form.elements.weight_kg?.addEventListener('input',totals);totals();const oldSubmit=form.onsubmit;form.onsubmit=async e=>{e.preventDefault();const before=orders.length;let o=Object.fromEntries(new FormData(form));['pallets','weight_kg','carrier_price','customer_price'].forEach(k=>o[k]=o[k]?Number(o[k]):null);['pickup_at','delivery_at'].forEach(k=>o[k]=o[k]?new Date(o[k]).toISOString():null);o.status='created';const {data:ord,error}=await s.from('orders').insert(o).select('id,order_number').single();if(error){note(document.getElementById('msg'),error.message,1);return}const stops=[];function pushBase(type){if(type==='pickup'&&o.pickup_name)stops.push({order_id:ord.id,stop_type:type,stop_sequence:1,name:o.pickup_name,address:o.pickup_address,contact_name:o.pickup_contact,phone:o.pickup_phone,planned_at:o.pickup_at,goods:o.goods,pallets:o.pallets,weight_kg:o.weight_kg,temperature:o.temperature,instructions:o.instructions});if(type==='delivery'&&o.delivery_name)stops.push({order_id:ord.id,stop_type:type,stop_sequence:1,name:o.delivery_name,address:o.delivery_address,contact_name:o.delivery_contact,phone:o.delivery_phone,planned_at:o.delivery_at,goods:o.goods,pallets:o.pallets,weight_kg:o.weight_kg,temperature:o.temperature,instructions:o.instructions})}pushBase('pickup');pushBase('delivery');for(const type of ['pickup','delivery']){let seq=2;for(const x of extraStops.filter(z=>z.type===type)){const get=k=>x.el.querySelector('[data-k='+k+']')?.value||null,name=get('name');if(!name)continue;stops.push({order_id:ord.id,stop_type:type,stop_sequence:seq++,name,address:get('address'),contact_name:get('contact_name'),phone:get('phone'),planned_at:get('planned_at')?new Date(get('planned_at')).toISOString():null,goods:get('goods'),pallets:get('pallets')?Number(get('pallets')):null,weight_kg:get('weight_kg')?Number(get('weight_kg')):null,temperature:get('temperature'),instructions:get('instructions')})}}if(stops.length){const {error:se}=await s.from('order_stops').insert(stops);if(se){alert('Ordren ble opprettet, men stoppene kunne ikke lagres: '+se.message)}}note(document.getElementById('msg'),'Ordre #'+ord.order_number+' opprettet med '+stops.length+' stopp.');form.reset();extraStops=[];pickupBox.querySelector('.multiStops').innerHTML='';deliveryBox.querySelector('.multiStops').innerHTML='';totals();await load()};const originalOpen=window.openO;window.openO=async id=>{originalOpen(id);const o=orders.find(x=>x.id===id);const {data:stops}=await s.from('order_stops').select('*').eq('order_id',id).order('stop_type').order('stop_sequence');if(!stops||stops.length<=2)return;const sheet=document.getElementById('sheet'),wrap=document.createElement('div');wrap.style.marginTop='18px';wrap.innerHTML='<div class="title">KJØRE- / STOPPLISTE</div>'+stops.map((x,i)=>'<div style="padding:10px;border-bottom:1px solid #e5e7eb"><b>STOPP '+(i+1)+' – '+(x.stop_type==='pickup'?'LASTING':'LOSSING')+'</b><br>'+esc(x.name)+' · '+esc(x.address||'')+'<br><span class="muted">'+esc(x.goods||'')+(x.pallets?' · '+x.pallets+' paller':'')+(x.weight_kg?' · '+x.weight_kg+' kg':'')+(x.planned_at?' · '+fmt(x.planned_at):'')+'</span></div>').join('');sheet.appendChild(wrap)};const logout=document.getElementById('logout');if(logout){const {data:{session}}=await s.auth.getSession();if(session){const {data:p}=await s.from('profiles').select('role').eq('id',session.user.id).single();if(p?.role==='admin'){const b=document.createElement('button');b.className='btn blue';b.textContent='Brukere';b.onclick=()=>location.href='/admin.html';logout.parentNode.insertBefore(b,logout)}}}}catch(e){console.error('multistop',e)}})();<\/script>`;h=h.replace('</body>',add+'</body>');document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<div style="font-family:Arial;padding:30px">Kunne ikke laste GNS Cargo: '+e.message+'</div>');</script></body></html>
