<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo Control Tower</title></head><body><script>(async()=>{const r=await fetch('/app.html?v=20260910-creator',{cache:'no-store'});let h=await r.text();const add=`<script>(async()=>{try{const signup=document.getElementById('signup');if(signup){const n=signup.cloneNode(true);n.type='button';n.onclick=()=>location.href='/signup.html';signup.replaceWith(n)}const creatorText=o=>o&&((o.created_by_name||o.created_by_email))?('Opprettet av: '+(o.created_by_name||o.created_by_email)):'Opprettet av: Ukjent';if(typeof rowHtml==='function'){const originalRow=rowHtml;rowHtml=function(o){let html=originalRow(o);const marker='<span class="muted">GNS-'+o.order_number+'</span>';return html.replace(marker,marker+'<br><span class="muted" style="font-size:10px">'+esc(creatorText(o))+'</span>')}}if(typeof cardHtml==='function'){const originalCard=cardHtml;cardHtml=function(o){let html=originalCard(o);const marker='<div class="muted">GNS-'+o.order_number+'</div>';return html.replace(marker,marker+'<div class="muted" style="font-size:11px;margin-top:3px">'+esc(creatorText(o))+'</div>')}}if(typeof openO==='function'){const originalOpen=openO;window.openO=function(id){originalOpen(id);const o=orders.find(x=>x.id===id);if(o&&document.getElementById('sheet')){const el=document.createElement('div');el.className='muted';el.style.cssText='margin-top:12px;padding-top:10px;border-top:1px solid #e5e7eb;font-size:12px';el.textContent=creatorText(o);document.getElementById('sheet').appendChild(el)}}}if(typeof render==='function')render();const logout=document.getElementById('logout');if(!logout)return;const b=document.createElement('button');b.id='usersBtn';b.className='btn blue hidden';b.textContent='Brukere';b.type='button';b.onclick=()=>location.href='/admin.html';logout.parentNode.insertBefore(b,logout);const {data:{session}}=await s.auth.getSession();if(!session)return;const {data:p}=await s.from('profiles').select('role').eq('id',session.user.id).single();if(p&&p.role==='admin')b.classList.remove('hidden')}catch(e){console.error(e)}})();<\/script>`;h=h.replace('</body>',add+'</body>');document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<div style="font-family:Arial;padding:30px">Kunne ikke laste GNS Cargo: '+e.message+'</div>');</script></body></html>
