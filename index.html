<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GNS Cargo Control Tower</title></head><body><script>(async()=>{const r=await fetch('/app.html?v=20260910-signupfix',{cache:'no-store'});let h=await r.text();const add=`<script>(async()=>{try{const signup=document.getElementById('signup');if(signup){const n=signup.cloneNode(true);n.type='button';n.onclick=()=>location.href='/signup.html';signup.replaceWith(n)}const logout=document.getElementById('logout');if(!logout)return;const b=document.createElement('button');b.id='usersBtn';b.className='btn blue hidden';b.textContent='Brukere';b.type='button';b.onclick=()=>location.href='/admin.html';logout.parentNode.insertBefore(b,logout);const {data:{session}}=await s.auth.getSession();if(!session)return;const {data:p}=await s.from('profiles').select('role').eq('id',session.user.id).single();if(p&&p.role==='admin')b.classList.remove('hidden')}catch(e){console.error(e)}})();<\/script>`;h=h.replace('</body>',add+'</body>');document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<div style="font-family:Arial;padding:30px">Kunne ikke laste GNS Cargo: '+e.message+'</div>');</script></body></html>
